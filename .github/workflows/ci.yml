name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact release tag to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      CE_MCP_ENABLE_ONLINE: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ".[benchmark,test]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline regression tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

  package:
    name: Build and validate distributions
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CE_MCP_ENABLE_ONLINE: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Check archive contents
        run: python tools/check_distribution.py
      - name: Test the wheel in an isolated environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          $checkEnv = Join-Path $env:RUNNER_TEMP 'control-expert-wheel-check'
          python -m venv $checkEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkPython = Join-Path $checkEnv 'Scripts/python.exe'
          & $checkPython -m pip install "$($wheel.FullName)[benchmark,test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $checkPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            & $checkPython -m unittest discover -s "$env:GITHUB_WORKSPACE/tools" -p "test_*.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Upload installable distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
