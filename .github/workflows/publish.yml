name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to validate and publish (optional on a tag)
        required: false
        type: string
      registry:
        description: Package registry
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'release' && 'pypi' || inputs.registry }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build the release
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read

  publish:
    name: Upload to ${{ github.event_name == 'release' && 'pypi' || inputs.registry }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.registry }}
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ github.event_name == 'release' && 'pypi' || inputs.registry }}
      REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
      REF_NAME: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate explicit release tag
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("An existing semantic release tag is required")
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/tags/{tag}"], check=True)
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Verify the package identity and production release tag
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected one validated wheel")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit("Expected one package metadata record")
              metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
          if metadata["Name"] != "control-expert-mcp":
              raise SystemExit("Unexpected package name")
          if os.environ["REGISTRY"] == "pypi":
              expected = "v" + metadata["Version"]
              if os.environ["REF_TYPE"] != "tag" or os.environ["REF_NAME"] != expected:
                  raise SystemExit(f"Production publishing requires the matching tag {expected}")
          print(f"Validated {metadata['Name']} {metadata['Version']} for {os.environ['REGISTRY']}")
          PY
      - name: Publish to TestPyPI with Trusted Publishing
        if: env.REGISTRY == 'testpypi'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI with Trusted Publishing
        if: env.REGISTRY == 'pypi'
        uses: pypa/gh-action-pypi-publish@v1.14.3
